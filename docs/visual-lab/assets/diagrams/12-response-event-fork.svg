<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 650" role="img" aria-labelledby="title desc">
  <title id="title">Publish 시도 뒤 갈라지는 producer와 broker 경로</title>
  <desc id="desc">POST event-orders 요청이 RabbitTemplate publish 시도까지 간 뒤, 정상 반환 시 HTTP 응답을 만드는 producer 경로와 accepted·routed된 경우 consumer로 전달되는 broker 경로가 독립적으로 진행됩니다. HTTP 응답 완료와 consumer 완료의 상대 순서는 보장되지 않습니다.</desc>
  <metadata>Source: A&amp;I Sequence 12 theory, implementation, checklist, OrderEventController, OrderService, EventPublisherService. License: repository policy; no standalone license grant.</metadata>
  <defs>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#2955e4"/>
    </marker>
    <marker id="arrow-teal" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#087f78"/>
    </marker>
  </defs>

  <rect width="720" height="650" rx="22" fill="#f1f7ff"/>
  <text x="24" y="45" fill="#111b3f" font-family="system-ui, sans-serif" font-size="29" font-weight="850">PUBLISH ATTEMPT → TWO LANES</text>
  <text x="696" y="43" text-anchor="end" fill="#6473a0" font-family="ui-monospace, monospace" font-size="24" font-weight="700">SEQ 12</text>

  <rect x="20" y="78" width="200" height="104" rx="14" fill="#ffffff" stroke="#6473a0" stroke-width="3"/>
  <text x="120" y="118" text-anchor="middle" fill="#0c2691" font-family="system-ui, sans-serif" font-size="24" font-weight="900">CONTROLLER</text>
  <text x="120" y="157" text-anchor="middle" fill="#111b3f" font-family="ui-monospace, monospace" font-size="24">/event-orders</text>
  <path d="M220 130H252" stroke="#2955e4" stroke-width="4" marker-end="url(#arrow-blue)"/>

  <rect x="260" y="78" width="180" height="104" rx="14" fill="#ffffff" stroke="#0c2691" stroke-width="3"/>
  <text x="350" y="118" text-anchor="middle" fill="#0c2691" font-family="system-ui, sans-serif" font-size="24" font-weight="900">SERVICE</text>
  <text x="350" y="157" text-anchor="middle" fill="#111b3f" font-family="system-ui, sans-serif" font-size="24">event 생성</text>
  <path d="M440 130H472" stroke="#2955e4" stroke-width="4" marker-end="url(#arrow-blue)"/>

  <rect x="480" y="78" width="220" height="104" rx="14" fill="#ecfbfa" stroke="#0c2691" stroke-width="3"/>
  <text x="590" y="118" text-anchor="middle" fill="#0c2691" font-family="system-ui, sans-serif" font-size="24" font-weight="900">RabbitTemplate</text>
  <text x="590" y="157" text-anchor="middle" fill="#111b3f" font-family="ui-monospace, monospace" font-size="24">publish 시도</text>

  <path d="M590 182V218H185V250" fill="none" stroke="#2955e4" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <path d="M590 182V250" fill="none" stroke="#087f78" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#arrow-teal)"/>

  <rect x="20" y="258" width="330" height="300" rx="16" fill="#ffffff" stroke="#2955e4" stroke-width="3"/>
  <text x="185" y="294" text-anchor="middle" fill="#0c2691" font-family="system-ui, sans-serif" font-size="24" font-weight="900">PRODUCER RETURN</text>
  <text x="185" y="323" text-anchor="middle" fill="#6473a0" font-family="system-ui, sans-serif" font-size="24">정상 반환 시</text>
  <rect x="42" y="340" width="286" height="52" rx="11" fill="#eaf0fb" stroke="#6473a0" stroke-width="2"/>
  <text x="185" y="374" text-anchor="middle" fill="#111b3f" font-family="system-ui, sans-serif" font-size="24" font-weight="800">호출 정상 반환</text>
  <path d="M185 392V410" stroke="#2955e4" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="42" y="418" width="286" height="52" rx="11" fill="#ffffff" stroke="#6473a0" stroke-width="2"/>
  <text x="185" y="452" text-anchor="middle" fill="#111b3f" font-family="system-ui, sans-serif" font-size="24" font-weight="800">OrderResponse</text>
  <path d="M185 470V488" stroke="#2955e4" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="42" y="496" width="286" height="44" rx="10" fill="#0c2691"/>
