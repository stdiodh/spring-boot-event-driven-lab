  <rect x="392" y="418" width="286" height="52" rx="11" fill="#ffffff" stroke="#6473a0" stroke-width="2"/>
  <text x="535" y="452" text-anchor="middle" fill="#111b3f" font-family="system-ui, sans-serif" font-size="24" font-weight="800">QUEUE</text>
  <path d="M535 470V488" stroke="#087f78" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <rect x="392" y="496" width="286" height="44" rx="10" fill="#087f78"/>
  <text x="535" y="527" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="800">CONSUMER</text>

  <rect x="20" y="580" width="680" height="50" rx="14" fill="#111b3f"/>
  <text x="360" y="613" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="850">정상 반환 ≠ broker acceptance · 두 완료 순서 미보장</text>
