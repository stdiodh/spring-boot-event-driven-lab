  <text x="535" y="294" text-anchor="middle" fill="#075e59" font-family="system-ui, sans-serif" font-size="24" font-weight="900">BROKER DELIVERY</text>
  <text x="535" y="323" text-anchor="middle" fill="#6473a0" font-family="system-ui, sans-serif" font-size="24">accepted · routed일 때</text>
  <rect x="392" y="340" width="286" height="52" rx="11" fill="#ecfbfa" stroke="#6473a0" stroke-width="2"/>
  <text x="535" y="374" text-anchor="middle" fill="#111b3f" font-family="system-ui, sans-serif" font-size="24" font-weight="800">RabbitMQ exchange</text>
