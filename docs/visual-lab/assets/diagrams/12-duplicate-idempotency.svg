<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 85 720 320" role="img" aria-labelledby="title desc">
  <title id="title">같은 orderId 이벤트의 process-local 중복 방지</title>
  <desc id="desc">연동·메시징 Consumer adapter가 같은 orderId 이벤트를 두 번 받아 서비스·정책 NotificationService로 전달하고, 상태·데이터 ConcurrentHashMap의 putIfAbsent가 현재 process 안에서 첫 이벤트만 저장하고 두 번째를 건너뛰는 흐름</desc>
  <metadata>Source: A&amp;I Sequence 12 theory, implementation, checklist and duplicate-delivery scenario. License: repository policy; no standalone license grant.</metadata>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0 0 11 5.5 0 11Z" fill="#2955E4"/></marker>
    <style>
      text{font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;fill:#111B3F}
      .boundary{fill:#FFFFFF;stroke:#94A3B8;stroke-width:2.5;stroke-dasharray:9 7}
      .node{stroke-width:3}
      .layer-outside{fill:#F1F5F9;stroke:#5B677A}
      .layer-interface{fill:#E6F4F7;stroke:#0E7490}
      .layer-application{fill:#F2EDFF;stroke:#6D43A8}
      .layer-resource{fill:#EAF5EE;stroke:#2C7352}
      .layer-integration{fill:#FFF4D6;stroke:#926000}
      .layer-runtime{fill:#EEF2F7;stroke:#52627A}
      [data-layer="outside"] .layer{fill:#5B677A}
      [data-layer="resource"] .layer{fill:#2C7352}
      .flow{fill:none;stroke:#2955E4;stroke-width:4;marker-end:url(#arrow)}
      .repeat{fill:none;stroke:#52627A;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#arrow)}
      .stored{fill:#EAF7F1;stroke:#176F72;stroke-width:2.5}
      .skipped{fill:#F6F7FA;stroke:#64748B;stroke-width:2.5}
      .boundary-name{font-size:25px;font-weight:850;fill:#52627A}
      .layer{font-size:25px;font-weight:850;fill:#4B587C;text-anchor:middle}
      .name{font-size:26px;font-weight:850;text-anchor:middle}
      .body{font-size:25px;font-weight:650;fill:#4B587C;text-anchor:middle}
      .event{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:25px;font-weight:850;fill:#0C2691}
      .state-name{font-size:25px;font-weight:850;text-anchor:middle}
    </style>
  </defs>
  <rect width="720" height="500" rx="22" fill="#F8F9FB"/>
  <g data-semantic="boundary">
    <rect x="170" y="98" width="530" height="300" rx="16" class="boundary"/>
    <text x="190" y="127" class="boundary-name">현재 프로세스 메모리</text>
  </g>
  <text x="20" y="192" class="event">#1 · id 42</text>
  <path d="M132 198H177" class="flow"/>
  <text x="20" y="266" class="event">#2 · id 42</text>
  <path d="M132 272H177" class="repeat"/>
  <g data-layer="integration">
    <text x="257" y="151" class="layer">메시징</text>
    <rect x="184" y="168" width="146" height="136" rx="13" class="node layer-integration"/>
    <text x="257" y="214" class="name">Consumer</text>
    <text x="257" y="252" class="body">adapter</text>
  </g>
  <path d="M330 236H343" class="flow"/>
  <g data-layer="application">
    <text x="430" y="151" class="layer">서비스·정책</text>
    <rect x="350" y="168" width="160" height="136" rx="13" class="node layer-application"/>
    <text x="430" y="222" class="name"><tspan x="430">Notification</tspan><tspan x="430" dy="34">Service</tspan></text>
  </g>
  <path d="M510 236H523" class="flow"/>
  <g data-layer="resource">
    <text x="605" y="151" class="layer">상태·데이터</text>
    <rect x="530" y="168" width="150" height="136" rx="13" class="node layer-resource"/>
    <text x="605" y="204" class="name">Concurrent</text>
    <text x="605" y="238" class="name">HashMap</text>
    <text x="605" y="272" class="body">putIfAbsent</text>
  </g>
  <g data-semantic="state">
    <rect x="195" y="326" width="230" height="58" rx="10" class="stored"/>
    <text x="310" y="363" class="state-name">✓ 첫 event 저장</text>
    <rect x="443" y="326" width="238" height="58" rx="10" class="skipped"/>
    <text x="562" y="363" class="state-name">두 번째는 건너뜀</text>
  </g>
</svg>
