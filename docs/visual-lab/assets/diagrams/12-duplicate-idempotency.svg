<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="title desc">
  <title id="title">같은 orderId 이벤트의 process-local 중복 방지</title>
  <desc id="desc">연동·메시징 Consumer adapter가 같은 orderId 이벤트를 두 번 받아 서비스·정책 NotificationService로 전달하고, 상태·데이터 ConcurrentHashMap의 putIfAbsent가 현재 process 안에서 첫 이벤트만 저장하고 두 번째를 건너뛰는 흐름</desc>
  <metadata>Source: A&amp;I Sequence 12 theory, implementation, checklist and duplicate-delivery scenario. License: repository policy; no standalone license grant.</metadata>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0 0 11 5.5 0 11Z" fill="#2955E4"/></marker>
    <style>
      text{font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;fill:#111B3F}
      .boundary{fill:#FFFFFF;stroke:#94A3B8;stroke-width:2.5;stroke-dasharray:9 7}
      .node{stroke-width:3}
      .layer-outside{fill:#F1F5F9;stroke:#5B677A}
      .layer-interface{fill:#E6F4F7;stroke:#0E7490}
      .layer-application{fill:#F2EDFF;stroke:#6D43A8}
      .layer-resource{fill:#EAF5EE;stroke:#2C7352}
      .layer-integration{fill:#FFF4D6;stroke:#926000}
      .layer-runtime{fill:#EEF2F7;stroke:#52627A}
      [data-layer="outside"] .layer{fill:#5B677A}
      [data-layer="resource"] .layer{fill:#2C7352}
      .flow{fill:none;stroke:#2955E4;stroke-width:4;marker-end:url(#arrow)}
      .repeat{fill:none;stroke:#52627A;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#arrow)}
      .stored{fill:#EAF7F1;stroke:#176F72;stroke-width:2.5}
      .skipped{fill:#F6F7FA;stroke:#64748B;stroke-width:2.5}
      .title{font-size:29px;font-weight:850}
      .sub{font-size:24px;font-weight:650;fill:#4B587C}
      .boundary-name{font-size:24px;font-weight:850;fill:#52627A}
      .layer{font-size:24px;font-weight:850;fill:#4B587C;text-anchor:middle}
      .name{font-size:24px;font-weight:850;text-anchor:middle}
      .body{font-size:24px;font-weight:650;fill:#4B587C;text-anchor:middle}
      .event{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:24px;font-weight:850;fill:#0C2691}
      .state-name{font-size:24px;font-weight:850;text-anchor:middle}
    </style>
  </defs>
  <rect width="720" height="500" rx="22" fill="#F8F9FB"/>
  <text x="22" y="43" class="title">중복 전달 · 범위가 있는 방어</text>
  <text x="22" y="75" class="sub">같은 orderId라도 broker는 다시 전달할 수 있다</text>
  <g data-semantic="boundary">
    <rect x="170" y="98" width="530" height="276" rx="16" class="boundary"/>
    <text x="190" y="127" class="boundary-name">현재 application process 경계</text>
  </g>
  <text x="20" y="166" class="event">#1 · id 42</text>
  <path d="M132 172H177" class="flow"/>
  <text x="20" y="250" class="event">#2 · id 42</text>
  <path d="M132 256H177" class="repeat"/>
  <g data-layer="integration">
    <rect x="184" y="145" width="146" height="130" rx="13" class="node layer-integration"/>
    <text x="257" y="172" class="layer">메시징</text>
    <text x="257" y="205" class="name">Consumer</text>
    <text x="257" y="234" class="body">adapter</text>
    <text x="257" y="261" class="body">반복 수신</text>
  </g>
  <path d="M330 210H343" class="flow"/>
  <g data-layer="application">
    <rect x="350" y="145" width="160" height="130" rx="13" class="node layer-application"/>
    <text x="430" y="172" class="layer">서비스·정책</text>
    <text x="430" y="205" class="name">Notification</text>
    <text x="430" y="232" class="name">Service</text>
    <text x="430" y="261" class="body">orderId 전달</text>
  </g>
  <path d="M510 210H523" class="flow"/>
  <g data-layer="resource">
    <rect x="530" y="145" width="150" height="130" rx="13" class="node layer-resource"/>
    <text x="605" y="172" class="layer">상태·데이터</text>
    <text x="605" y="204" class="name">Concurrent</text>
    <text x="605" y="230" class="name">HashMap</text>
    <text x="605" y="261" class="body">putIfAbsent</text>
  </g>
  <g data-semantic="state">
    <rect x="195" y="307" width="230" height="48" rx="10" class="stored"/>
    <text x="310" y="338" class="state-name">✓ 첫 event 저장</text>
    <rect x="443" y="307" width="238" height="48" rx="10" class="skipped"/>
    <text x="562" y="338" class="state-name">두 번째 event 건너뜀</text>
  </g>
  <g data-semantic="state">
    <rect x="90" y="412" width="540" height="54" rx="12" class="skipped"/>
    <text x="360" y="435" class="state-name">보장 범위 · 현재 process 메모리</text>
    <text x="360" y="457" class="body">재시작·다중 instance·영속 중복까지 해결하지 않음</text>
  </g>
</svg>
