<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 80 720 330" role="img" aria-labelledby="title desc">
  <title id="title">후속 작업을 같은 호출 흐름에서 직접 실행</title>
  <desc id="desc">서비스·정책 레이어의 OrderService가 같은 레이어의 NotificationService 구현을 직접 호출하고, 같은 call stack에서 즉시 결과를 받아 주문 흐름을 계속하는 동기 비교안</desc>
  <metadata>Source: A&amp;I Sequence 12 theory and direct-call comparison scenario. License: repository policy; no standalone license grant.</metadata>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0 0 11 5.5 0 11Z" fill="#2955E4"/></marker>
    <marker id="return-arrow" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0 0 11 5.5 0 11Z" fill="#176F72"/></marker>
    <style>
      text{font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;fill:#111B3F}
      .flow-panel{fill:#FFFFFF;stroke:#94A3B8;stroke-width:2.5}
      .node{stroke-width:3}
      .layer-outside{fill:#F1F5F9;stroke:#5B677A}
      .layer-interface{fill:#E6F4F7;stroke:#0E7490}
      .layer-application{fill:#F2EDFF;stroke:#6D43A8}
      .layer-resource{fill:#EAF5EE;stroke:#2C7352}
      .layer-integration{fill:#FFF4D6;stroke:#926000}
      .layer-runtime{fill:#EEF2F7;stroke:#52627A}
      [data-layer="outside"] .layer{fill:#5B677A}
      [data-layer="resource"] .layer{fill:#2C7352}
      .call{fill:none;stroke:#2955E4;stroke-width:4;marker-end:url(#arrow)}
      .return{fill:none;stroke:#176F72;stroke-width:4;marker-end:url(#return-arrow)}
      .layer-band{font-size:25px;font-weight:850;fill:#4B587C;text-anchor:middle}
      .name{font-size:27px;font-weight:850;text-anchor:middle}
      .arrow-label{font-size:25px;font-weight:850;fill:#0C2691;text-anchor:middle}
    </style>
  </defs>
  <rect width="720" height="510" rx="22" fill="#F8F9FB"/>
  <g data-semantic="lane">
    <rect x="20" y="100" width="680" height="292" rx="16" class="flow-panel"/>
    <text x="360" y="136" class="layer-band">서비스·정책</text>
  </g>
  <g data-layer="application">
    <rect x="140" y="154" width="440" height="76" rx="14" class="node layer-application"/>
    <text x="360" y="200" class="name">OrderService</text>
  </g>
  <path d="M250 230V274" class="call"/>
  <text x="155" y="260" class="arrow-label">직접 호출</text>
  <path d="M470 274V230" class="return"/>
  <text x="565" y="260" class="arrow-label">즉시 결과</text>
  <g data-layer="application">
    <rect x="140" y="274" width="440" height="76" rx="14" class="node layer-application"/>
    <text x="360" y="320" class="name">NotificationService</text>
  </g>
</svg>
